        - heading "About the instructors" [level=2] [ref=e101]
        - generic [ref=e103]:
          - generic [ref=e104]:
            - img "Drew Bent" [ref=e105]
            - generic [ref=e106]:
              - heading "Drew Bent" [level=3] [ref=e107]
              - paragraph [ref=e108]: Drew leads education research at Anthropic. He previously co-founded the tutoring non-profit Schoolhouse.world with Sal Khan, which he ran from 2020-24 and now sits on the board. Prior to that, he wrote code at Khan Academy, taught high school math, and has been tutoring students for over a decade. Drew has degrees in physics & CS from MIT, and an education master's from Stanford.
          - generic [ref=e109]:
            - img "Rick Dakan" [ref=e110]
            - generic [ref=e111]:
              - heading "Rick Dakan" [level=3] [ref=e112]
              - paragraph [ref=e113]: Rick is the AI Coordinator and a professor at Ringling College of Art and Design in Sarasota, Florida where he teaches creative writing, interactive experience design, and AI courses. He also oversees the college's Undergraduate Certificate in Artificial Intelligence and the Professional Certificate in Fundamentals of AI for Creatives. He is a game designer and author of more than thirty games and books from video games and tabletop games to novels, nonfiction, and comics.
          - generic [ref=e114]:
            - img "Joseph Feller" [ref=e115]
            - generic [ref=e116]:
              - heading "Joseph Feller" [level=3] [ref=e117]
              - paragraph [ref=e118]: Joseph is Professor of Information Systems and Digital Transformation at the Cork University Business School, University College Cork, Ireland. His current work focuses on AI-human hybrid creativity, innovation, and learning. His research has been published in Information Systems Research, Journal of MIS, Journal of the AIS, Journal of Information Technology, Information Systems Journal, European Journal of Information Systems, and Journal of Strategic Information Systems, and has been funded by the European Commission, Irish Research Council, Irish HEA, and other funding bodies.
              - paragraph
          - generic [ref=e119]:
            - img "Maggie Vo" [ref=e120]
            - generic [ref=e121]:
              - heading "Maggie Vo" [level=3] [ref=e122]
              - paragraph [ref=e123]: Maggie founded and leads Anthropic's education team. She has a varied applied research background from Harvard University, with a career and education that spans fields such as game design, organizational behavior, tech and consumer goods, and human behavioral psychology. Maggie has held previous roles at top consulting firms and innovative startups alike. Prior to Anthropic, she worked in AI strategy consulting.
              - paragraph
