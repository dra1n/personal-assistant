            - heading "AI Fundamentals & Framework" [level=3] [ref=e83]
            - text: 10 lessons
          - paragraph [ref=e84]: Establish foundational understanding of generative AI systems and why developing AI fluency matters for effective collaboration. Introduces the 4D Framework as a structured approach to human-AI interaction, covering core capabilities and limitations of current AI technologies. Provides the conceptual grounding needed to approach AI tools strategically rather than reactively.
