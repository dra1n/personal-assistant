        - generic [ref=e127]:
          - paragraph [ref=e128]: "In the development of the AI Fluency: Framework and Foundations course, we engaged in extensive collaboration with Claude 3.7 from Anthropic."
          - paragraph [ref=e129]: "The base content for this course came from:"
          - list [ref=e130]:
            - listitem [ref=e131]: The AI Fluency Framework Practical Summary Document by Rick Dakan (at Ringling College of Art and Design) and Joseph Feller (at University College Cork) and related working documents and research notes
            - listitem [ref=e132]: Slide decks and lecture transcripts from multiple university courses, guest lectures, and research talks delivered by Feller and/or Dakan
            - listitem [ref=e133]: Technical/practical content provided by Maggie Vo and Drew Bent (Anthropic)
          - paragraph [ref=e134]: Throughout this process, Claude assisted one or more of the human authors with structural development, resource and exercise design, and content drafting, critiquing, editing and rewriting. The human authors wrote, designed, edited and provided continual vision, expertise, critical judgment, and domain knowledge and made all final decisions about both content and approach.
          - paragraph [ref=e135]: All AI-generated and co-created content underwent thorough validation, editing, and curation by the human authors. The final materials accurately reflect the human authors' understanding, expertise, and intended pedagogical approach. While AI assistance was instrumental in producing these materials, the human authors maintain responsibility for the content.
          - paragraph [ref=e136]: This disclosure is made in the spirit of transparency advocated by the AI Fluency Framework and to acknowledge the evolving role of AI in educational content development and other creative and intellectual work.
